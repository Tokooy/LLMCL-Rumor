# --------------------------------------------------------------------- #
# Proposed-1：7B 基座，增强 1 轮（w=1），无微调（M=0）
# 论文 Twitter15 ACC 78.11% / Twitter16 ACC 79.63%
# --------------------------------------------------------------------- #
defaults:
  - ../llm/qwen7b.yaml

experiment:
  name: proposed-1
  description: "7B, augmentation rounds w=1, fine-tuning rounds M=0"
  llm_size: 7B
  augment_rounds: 1
  finetune_rounds: 0

training:
  cl:
    epochs: 5
    augment_every_epochs: 1
  alignment:
    enabled: false
    max_augment_rounds: 1
    max_finetune_rounds: 0
