# LLMCL-Rumor 测试配置
# --------------------------------------------------------------------- #
# 所有测试都可以在无 GPU、无网络的环境下运行：
#   依赖 torch 的用例用 pytest.importorskip 自动跳过，而不是失败。
#
# 常用命令：
#   pytest -q                      # 全部测试
#   pytest -m "not slow"           # 跳过较慢的用例
#   python scripts/check_syntax.py # 只做语法自检（不导入任何依赖）
# --------------------------------------------------------------------- #

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    torch: 需要 PyTorch 的用例
    slow: 较慢的用例（默认仍会执行，可用 -m "not slow" 跳过）
filterwarnings =
    ignore::DeprecationWarning
