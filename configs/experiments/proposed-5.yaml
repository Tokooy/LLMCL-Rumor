# --------------------------------------------------------------------- #
# Proposed-5：7B 基座，增强 3 轮（w=3），微调 2 次（M=2）
# 论文 Twitter15 ACC 80.81% / Twitter16 ACC 85.31%
#
# 论文："微调轮次的增加也能进一步提升检测准确率，但仍无法超越较大参数量的
#        LLM 模型的表现"（对应 Proposed-6）。
# --------------------------------------------------------------------- #
defaults:
  - ../llm/qwen7b.yaml

experiment:
  name: proposed-5
  description: "7B, augmentation rounds w=3, fine-tuning rounds M=2"
  llm_size: 7B
  augment_rounds: 3
  finetune_rounds: 2

training:
  cl:
    epochs: 15
    augment_every_epochs: 1
  alignment:
    enabled: true
    max_augment_rounds: 3
    max_finetune_rounds: 2
    finetune_interval_epochs: 5
    momentum_beta: 0.9
    lambda_source: contrastive_accuracy
