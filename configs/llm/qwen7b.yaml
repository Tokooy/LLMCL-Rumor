# ===================================================================== #
# 基座 LLM：Qwen2.5-7B-Instruct（论文主实验对象）
# --------------------------------------------------------------------- #
# 论文："我们选择 Qwen7B 作为主要实验对象，并引入 Qwen13B 进行对比"（文献[36] Qwen）。
# 论文发表时 Qwen2.5 尚未发布，这里选择当前可用的同级 7B 指令模型；
# 若要严格对齐论文时间点，把 model_name 换成 Qwen/Qwen1.5-7B-Chat 即可。
# ===================================================================== #

defaults:
  - ../base.yaml

llm:
  backend: transformers
  model_name: Qwen/Qwen2.5-7B-Instruct
  local_dir: ""            # 例：/data/models/Qwen2.5-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  max_new_tokens: 1024

  augmentation:
    copies_per_sample: 1
    batch_size: 4

  lora:
    enabled: true
    r: 8
    alpha: 16
    learning_rate: 0.0001
